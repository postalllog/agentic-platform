apiVersion: postalllog.ai/v1
kind: Agent
metadata:
  name: hello-world
  owner: platform
spec:
  runtime:
    deployment: code_zip
    protocol: HTTP
    entrypoint: main.py
  exposure:
    authentication: IAM
  models:
    arns: []
  capabilities:
    memory: false
    browser: false
    code_interpreter: false
